:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --surround:#0e0c16;
  --ink:#0d0b14; --night:#1a1726; --shadow:#2b2540; --dusk:#463c5e; --mist:#a39fb8; --bone:#eee8d5;
  --navy:#1b2640; --red:#e84a3c; --neon:#4fa3ff; --spot:#ffd23f; --glow:#fff4a8; --gold:#c98a1e;
  --pixel:'Press Start 2P','Galmuri11',monospace;
  --gal:'Galmuri11','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --s:2px;
  --k:1;
  background:var(--surround);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surround:#0e0c16}}
:root[data-theme="dark"]{--surround:#0e0c16}
:root[data-theme="light"]{--surround:#1a1726}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--surround);color:var(--bone);font-family:var(--gal);-webkit-font-smoothing:none;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--spot);outline-offset:2px}

#game{position:relative;width:min(100%,480px);max-width:100%;height:100%;margin:0 auto;overflow:hidden;background:var(--navy)}
#stage{position:absolute;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.layer{position:absolute;inset:0}
.hidden,[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.px{font-family:var(--pixel);letter-spacing:1px}
.outline{text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink),3px 3px var(--ink)}

/* ---------- 공통 버튼 ---------- */
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--shadow);border:2px solid var(--dusk);padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.35;cursor:default}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--shadow);border:3px solid var(--bone);padding:0}

/* ---------- 타이틀 ---------- */
#title .logo{position:absolute;left:0;right:0;top:calc(40px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#title .logo .px{font-size:32px;line-height:1.35}
#title .logo .sub{font-size:12px;color:var(--mist)}
#title .actions{position:absolute;left:18px;right:18px;bottom:24px;display:flex;flex-direction:column;gap:12px}
#startBtn{font-size:16px}
#startBtn span{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 라운드 ---------- */
#hud{position:absolute;left:18px;right:18px;top:18px;display:flex;flex-direction:column;gap:12px}
#hud .row{display:flex;justify-content:space-between;align-items:center}
#roundLabel{font-size:16px}
#roundLabel span{color:var(--mist)}
#gauge{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;height:10px}
#gauge i{border:2px solid var(--dusk)}
#gauge i.on{background:var(--bone);border-color:var(--bone)}
#qwrap{position:absolute;left:18px;right:18px;display:flex;align-items:center;justify-content:center}
#question{margin:0;font-weight:700;line-height:1.5;text-align:center;word-break:keep-all;white-space:pre-line}
#question.enter{animation:qin .24s steps(3) both}
@keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#answers{position:absolute;left:18px;right:18px;bottom:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ans{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;touch-action:manipulation}
.cap{display:block;width:calc(var(--s) * 56 * var(--k));height:calc(var(--s) * 54 * var(--k));background-repeat:no-repeat;background-size:200% 100%;background-position:0 0;image-rendering:pixelated}

.ans:active .cap,.ans.hit .cap{background-position:100% 0}
.ans .lb{font-size:12px;font-weight:700}
#answers.locked .ans{cursor:default}
#pop{position:absolute;left:0;right:0;text-align:center;font-size:24px;pointer-events:none}
#pop.show{animation:pop .6s steps(4) both}
@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.15)}60%{transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#banner{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;text-align:center}
#banner .big1{font-size:32px}
#banner .big2{font-size:16px;color:var(--mist)}
#banner.show{animation:bn .5s steps(3) both}
@keyframes bn{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}

/* ---------- 결과 ---------- */
#result{background:rgba(26,23,38,.9);overflow-y:auto;-webkit-overflow-scrolling:touch}
#result .inner{padding:28px 18px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.r-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.r-head .sm{font-size:8px;color:var(--mist)}
.r-head .lg{font-size:20px}
.r-head p{margin:0;font-size:12px;color:var(--mist)}
.note{font-size:12px;line-height:1.6;color:var(--mist);border:2px dashed var(--dusk);padding:10px 12px;text-align:center}
.champ{border:3px solid var(--spot);background:var(--shadow);padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.champ .tag{font-size:8px;color:var(--spot)}
#belt{background-repeat:no-repeat;image-rendering:pixelated;background-position:0 0}
.champ .q{font-size:24px;font-weight:700;line-height:1.5;word-break:keep-all;white-space:pre-line}
.bar{display:flex;align-items:center;gap:8px;width:100%}
.track{flex:1;height:10px;background:var(--night)}
.fill{height:100%;background:var(--bone);width:0;transition:width .6s steps(8)}
.champ .track{height:16px}
.champ .fill{background:var(--spot)}
.pct{font-size:12px;width:40px;text-align:right;font-weight:700}
.me{font-size:12px;font-weight:700;padding:2px 6px;border:2px solid var(--dusk);color:var(--mist);white-space:nowrap}
.me.o{border-color:var(--red);color:var(--red)}
.me.x{border-color:var(--neon);color:var(--neon)}
#list{list-style:none;margin:0;padding:0;border-top:2px solid var(--shadow)}
#list li{display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--shadow)}
#list li.pending{visibility:hidden}
#list li.in{animation:qin .24s steps(3) both}
#list .no{width:32px;flex:none;font-size:12px;color:var(--mist);padding-top:2px}
#list .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#list .body p{margin:0;font-size:12px;line-height:1.6;word-break:keep-all}
.champ.pending{visibility:hidden}
.champ.in{animation:bn .5s steps(3) both}
.r-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:auto}

<body>
<div id="game">
  <canvas id="stage" width="180" height="320" aria-hidden="true"></canvas>

  <!-- 타이틀 -->
  <section id="title" class="layer" aria-label="타이틀">
    <h1 class="sr">BOXING OX 진실게임</h1>
    <div class="actions">
      <button class="plate px" id="startBtn" type="button"><span>START</span></button>
      <button class="plate sec" id="resultBtn" type="button" hidden>랭킹 보기</button>
    </div>
  </section>

  <!-- 라운드 -->
  <section id="round" class="layer hidden" aria-label="라운드">
    <div id="hud">
      <div class="row">
        <button class="icon-btn" id="backBtn" type="button" aria-label="이전 라운드로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="px outline" id="roundLabel">ROUND 01 <span>/ 10</span></div>
        <span style="width:44px;height:44px" aria-hidden="true"></span>
      </div>
      <div id="gauge" aria-hidden="true"></div>
    </div>
    <div id="qwrap"><p id="question" class="outline" aria-live="polite"></p></div>
    <div id="banner" aria-hidden="true"></div>
    <div id="pop" class="px outline" aria-hidden="true"></div>
    <div id="answers">
      <button class="ans" id="btnO" type="button" aria-label="O, 있다"><span class="cap"></span><span class="lb outline">있다</span></button>
      <button class="ans" id="btnX" type="button" aria-label="X, 없다"><span class="cap"></span><span class="lb outline">없다</span></button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="layer hidden" aria-label="결과">
    <div class="inner">
      <div class="r-head">
        <span class="px sm">JUDGES' DECISION</span>
        <span class="px lg outline">TRUTH RANKING</span>
        <p id="rSub"></p>
      </div>
      <div class="note hidden" id="rNote"></div>
      <div class="champ pending" id="champ">
        <span class="px tag">CHAMPION</span>
        <div id="belt" role="img" aria-label="챔피언 벨트"></div>
        <div class="q" id="cQ"></div>
        <div class="bar"><div class="track"><div class="fill" id="cFill"></div></div><span class="pct" id="cPct"></span><span class="me" id="cMe"></span></div>
      </div>
      <ol id="list"></ol>
      <button class="plate sec" id="moreBtn" type="button" aria-expanded="false">전체 보기</button>
      <div class="r-actions">
        <button class="plate sec" id="againBtn" type="button">처음으로</button>
        <button class="plate" id="shareBtn" type="button">공유하기</button>
      </div>
      <input id="linkArea" class="hidden" readonly aria-label="공유 링크">
    </div>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

var game=document.getElementById('game'), cv=document.getElementById('stage'), ctx=cv.getContext('2d');
var S=2;
function layout(){
  var maxW=Math.floor(180*(window.innerHeight-176)/202);
  game.style.width=Math.max(280,Math.min(480,window.innerWidth,maxW))+'px';
  var W=game.clientWidth, H=game.clientHeight, dpr=window.devicePixelRatio||1;
  var p=Math.ceil(W*dpr/180);           // 아트 1픽셀 = 물리 픽셀 p개 (정수)
  S=p/dpr;
  var cw=180*S, left=Math.round((W-cw)/2*dpr)/dpr;
  cv.style.width=cw+'px'; cv.style.height=(320*S)+'px'; cv.style.left=left+'px';
  document.documentElement.style.setProperty('--s',S+'px');
  // 질문 영역: HUD 아래 ~ 로프 위
  var ropeTop=134*S, qTop=96;
  var qw=document.getElementById('qwrap');
  qw.style.top=qTop+'px'; qw.style.height=Math.max(60,ropeTop-qTop-6)+'px';
  var qfs=W>=340?24:18;
  document.getElementById('question').style.fontSize=qfs+'px';
  // 발 아래 영역
  var feet=FEET*S;
  document.getElementById('pop').style.top=(feet+18)+'px';
  document.getElementById('banner').style.top=(60*S+40)+'px';
  // O/X 버튼: 공간이 부족한 작은 화면에서만 살짝 축소
  var avail=H-(feet+48)-24, need=54*S+24;
  var k=Math.max(0.6,Math.min(1,avail/need));
  document.documentElement.style.setProperty('--k',k);
  // 벨트
  var belt=document.getElementById('belt');
  belt.style.width=(80*S)+'px'; belt.style.height=(28*S)+'px';
  belt.style.backgroundSize=(160*S)+'px '+(28*S)+'px';
  draw();
}

var scene={red:0,blue:0,redTop:true,bob:0,spark:null,show:true,logo:false};
var SHADOW=[26,38,44,44,38,26];
function drawShadow(cx){
  ctx.fillStyle='rgba(13,11,20,0.55)';
  for(var i=0;i<SHADOW.length;i++){var w=SHADOW[i];ctx.fillRect(cx-(w>>1),FEET-3+i,w,1)}
}
var SPARK=["...g...",".g.s.g.","..sws..","gswwwsg","..sws..",".g.s.g.","...g..."];
var SPC={g:'#c98a1e',s:'#ffd23f',w:'#fff4a8'};
function drawSpark(x,y){
  for(var r=0;r<7;r++)for(var c=0;c<7;c++){var k=SPARK[r][c];if(k!=='.'){ctx.fillStyle=SPC[k];ctx.fillRect(x-3+c,y-3+r,1,1)}}
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#1b2640';ctx.fillRect(0,0,180,320);
  if(imgs.bg) ctx.drawImage(imgs.bg,0,0);
  if(scene.logo&&imgs.logo) ctx.drawImage(imgs.logo,26,40);
  if(!scene.show||!imgs.red||!imgs.blue) return;
  drawShadow(46); drawShadow(127);
  var br=(scene.red===0&&scene.bob===1)?1:0, bb=(scene.blue===0&&scene.bob===0)?1:0;
  function R(){ctx.drawImage(imgs.red,scene.red*96,0,96,80,RED_X,SPR_Y+br,96,80)}
  function B(){ctx.drawImage(imgs.blue,scene.blue*96,0,96,80,BLUE_X,SPR_Y+bb,96,80)}
  if(scene.redTop){B();R()}else{R();B()}
  if(scene.spark) drawSpark(scene.spark[0],scene.spark[1]);
}
var reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

var FB_VER='12.19.0', FB='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
var fb=null;
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
var fbP=(async function(){
  var cfg=window.FIREBASE_CONFIG||{};
  if(!cfg.apiKey||!cfg.projectId) return;
  try{
    var m=await withTimeout(Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]),10000);
    var app=m[0].initializeApp(cfg);
    var cred=await withTimeout(m[1].signInAnonymously(m[1].getAuth(app)),10000);
    fb={fs:m[2],db:m[2].getFirestore(app),uid:cred.user.uid};
  }catch(e){ console.warn('Firebase 연결 실패',e); fb=null }
})();
async function fetchAgg(){
  await fbP; if(!fb) return null;
  try{
    var fs=fb.fs, col=fs.collection(fb.db,'votes');
    // 한 번의 집계 요청에는 집계 항목을 5개까지만 넣을 수 있어 나눠서 요청
    var groups=[{n:fs.count()}], cur=groups[0];
    for(var i=0;i<10;i++){ if(Object.keys(cur).length>=5){cur={};groups.push(cur)} cur['s'+i]=fs.sum('q'+(i+1)) }
    var res=await withTimeout(Promise.all(groups.map(function(g){return fs.getAggregateFromServer(col,g)})),10000);
    var d={}; res.forEach(function(r){Object.assign(d,r.data())});
    var o=[]; for(var j=0;j<10;j++) o.push(Number(d['s'+j])||0);
    return {n:Number(d.n)||0,o:o};
  }catch(e){ console.warn('집계 불러오기 실패',e); return null }
}
async function submit(ans){
  await fbP; if(!fb) return 'offline';
  var fs=fb.fs, data={at:fs.serverTimestamp()};
  ans.forEach(function(v,i){data['q'+(i+1)]=v});
  try{ await withTimeout(fs.setDoc(fs.doc(fb.db,'votes',fb.uid),data),10000); return 'ok' }
  catch(e){ console.warn('응답 저장 실패',e); return 'fail' }
}

  var qEl=document.getElementById('question');

function choose(v){

  answers[idx]=v;
  var btn=document.getElementById(v===1?'btnO':'btnX');
  btn.classList.add('hit');
  var pop=document.getElementById('pop');
  if(v===1){ scene.red=1;scene.blue=2;scene.redTop=true;scene.spark=TIP.red;pop.style.color='var(--red)' }
  else { scene.blue=1;scene.red=2;scene.redTop=false;scene.spark=TIP.blue;pop.style.color='var(--neon)' }
  pop.textContent='PUNCH!';pop.classList.remove('show');void pop.offsetWidth;pop.classList.add('show');
  draw();
  setTimeout(function(){scene.spark=null;draw()},160);

}

async function showResult(my,status){
  revealTimers.forEach(clearTimeout); revealTimers=[];
  scene.show=true;scene.red=0;scene.blue=0;scene.logo=false;draw();
  show($res); $res.scrollTop=0;
  var agg=await fetchAgg();
  var votes=agg&&agg.n>0?agg:null, N=votes?votes.n:0;
  var note=document.getElementById('rNote'), msgs=[];
  if(status==='fail') msgs.push('내 응답을 저장하지 못해 이번 집계에는 들어가지 않았어요. 잠시 후 다시 해 주세요.');
  if(!votes){ msgs.push('집계 서버에 연결하지 못해 다른 복서들의 응답을 불러오지 못했어요. 아래는 질문 순서대로 보여 주는 내 응답이에요.'); }
  if(status==='past'&&votes) msgs.push('지난번 내 응답과 지금까지의 집계예요.');
  note.classList.toggle('hidden',!msgs.length); note.textContent=msgs.join(' ');
  document.getElementById('rSub').textContent=votes?'복서들이 가장 많이 O를 누른 질문':'집계 없이 보는 내 응답';

  var rows=Q.map(function(q,i){
    var o=votes?votes.o[i]:0;
    return {i:i,q:q.replace(/\n/g,' '),qb:q,o:o,p:N?Math.min(1,o/N):0};
  });
  if(votes) rows.sort(function(a,b){return b.p-a.p||b.o-a.o||a.i-b.i});
  var meTxt=function(i){return my&&my[i]!=null?(my[i]===1?'나 O':'나 X'):'—'};
  var meCls=function(i){return my&&my[i]!=null?(my[i]===1?'me o':'me x'):'me'};
  var pctTxt=function(r){return votes?Math.round(r.p*100)+'%':''};

  var c=rows[0], champ=document.getElementById('champ');
  document.getElementById('belt').style.backgroundImage='url('+ART.belt+')';
  document.getElementById('cQ').textContent=c.qb;
  document.getElementById('cPct').textContent=pctTxt(c);
  var cm=document.getElementById('cMe'); cm.textContent=meTxt(c.i); cm.className=meCls(c.i);
  document.getElementById('cFill').style.width='0';
  champ.classList.add('pending'); champ.classList.remove('in');
  champ.querySelector('.tag').textContent=votes?'CHAMPION':'Q.'+pad(c.i+1);
  document.getElementById('belt').classList.toggle('hidden',!votes);
  champ.style.borderColor=votes?'':'var(--dusk)';

  var list=document.getElementById('list'); list.innerHTML='';
  var items=rows.slice(1).map(function(r,k){
    var li=document.createElement('li'); li.className=k>=4?'extra collapsed':'pending';
    li.innerHTML='<span class="no px">'+(votes?pad(k+2):'Q'+pad(r.i+1))+'</span><div class="body"><p>'+esc(r.q)+'</p><div class="bar"><div class="track"><div class="fill"></div></div><span class="pct">'+pctTxt(r)+'</span><span class="'+meCls(r.i)+'">'+meTxt(r.i)+'</span></div></div>';
    list.appendChild(li); if(k>=4) li.querySelector('.fill').style.width=(votes?Math.round(r.p*100):0)+'%';
    return {li:li,p:r.p};
  });
  var more=document.getElementById('moreBtn'); more.textContent='전체 보기'; more.setAttribute('aria-expanded','false');
  // 10위 → 2위 → 1위 순서로 공개
  var step=reduced?0:260, t=300;
  for(var k=Math.min(3,items.length-1);k>=0;k--){(function(it){
    revealTimers.push(setTimeout(function(){it.li.classList.remove('pending');it.li.classList.add('in');it.li.querySelector('.fill').style.width=(votes?Math.round(it.p*100):0)+'%'},t)); t+=step;
  })(items[k])}
  revealTimers.push(setTimeout(function(){
    champ.classList.remove('pending');champ.classList.add('in');
    document.getElementById('cFill').style.width=(votes?Math.round(c.p*100):0)+'%';
    if(votes){startBelt()}
  },t+(reduced?0:500)));

  document.getElementById('linkArea').classList.add('hidden');
}
document.getElementById('againBtn').onclick=function(){ revealTimers.forEach(clearTimeout); if(beltTimer){clearTimeout(beltTimer);beltTimer=null} toTitle() };
document.getElementById('moreBtn').onclick=function(){
  var open=this.getAttribute('aria-expanded')!=='true';
  document.querySelectorAll('#list li.extra').forEach(function(li){li.classList.toggle('collapsed',!open)});
  this.setAttribute('aria-expanded',open?'true':'false'); this.textContent=open?'TOP 5만 보기':'전체 보기';
};
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},2000)}
function legacyCopy(txt){try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);return ok}catch(e){return false}}
document.getElementById('shareBtn').onclick=async function(){
  var ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(SHARE_URL); ok=true } }catch(e){}
  if(!ok) ok=legacyCopy(SHARE_URL);
  if(ok){ toast('링크가 복사되었어요') }
  else { var la=document.getElementById('linkArea'); la.value=SHARE_URL; la.classList.remove('hidden'); la.focus(); la.select(); toast('아래 링크를 길게 눌러 복사하세요') }
};

/* ================= 키보드 ================= */
document.addEventListener('keydown',function(e){
  if($r.classList.contains('hidden')) return;
  var k=e.key.toLowerCase();
  if(k==='o'||k==='arrowleft'){e.preventDefault();choose(1)}
  else if(k==='x'||k==='arrowright'){e.preventDefault();choose(0)}
});

/* ================= 시작 ================= */
window.addEventListener('resize',layout);
Promise.all(['bg','red','blue','belt','logo'].map(loadImg)).then(function(){ layout(); toTitle() });
layout();
})();
</script>
